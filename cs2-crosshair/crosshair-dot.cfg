// Маленькая жёлтая точка встроенного прицела CS2 — видна в «окошке» в центре ☭.
// Вставить в консоль игры (клавиша ~) одной строкой или положить в папку cfg и выполнить: exec crosshair-dot
cl_crosshairstyle 4
cl_crosshairsize 0
cl_crosshairgap 0
cl_crosshairthickness 0.5
cl_crosshairdot 1
cl_crosshair_t 0
cl_crosshaircolor 5
cl_crosshaircolor_r 255
cl_crosshaircolor_g 215
cl_crosshaircolor_b 0
cl_crosshairusealpha 1
cl_crosshairalpha 255
cl_crosshair_drawoutline 1
cl_crosshair_outlinethickness 1
